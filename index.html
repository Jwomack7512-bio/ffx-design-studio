<title>FFX Design Studio</title>
<style>
/* Base reset; the app stylesheet is injected below at build time. */
html,body{margin:0;padding:0;background:#f6f4ef;color:#1f1d1a;font:16px/1.45 system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
#app{min-height:100vh;}
.no-bundle{max-width:640px;margin:12vh auto;padding:32px;background:#fff;border:1px solid #ddd6c8;border-radius:12px;}
.no-bundle h1{margin-top:0;font-size:22px;}
.no-bundle code{background:#f0ece3;padding:2px 6px;border-radius:4px;}
/* ===== src/styles.css ===== */
/*
 * styles.css - Design Studio theme. Light only, CSS variables, system fonts,
 * 16px base, >= 4.5:1 text contrast, severity always icon + word (never colour
 * alone), sticky table headers, and a print stylesheet for the roster.
 */

:root {
  --bg: #f6f4ef;
  --panel: #ffffff;
  --panel-2: #fbfaf7;
  --ink: #1f1d1a;
  --ink-soft: #423d36;
  --muted: #575146;
  --line: #d8d0c0;
  --line-soft: #e8e2d6;
  --accent: #17537a;
  --accent-soft: #e4eef5;
  --accent-ink: #ffffff;
  --err: #93201a;
  --err-bg: #fbe9e7;
  --warn: #714a00;
  --warn-bg: #fbf1dd;
  --info: #17537a;
  --info-bg: #e8f0f6;
  --ok: #175c32;
  --ok-bg: #e7f2ea;
  --chip: #efeade;
  --focus: #a4470c;
  --shadow: 0 1px 2px rgba(31, 29, 26, .10), 0 6px 18px rgba(31, 29, 26, .07);
  --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --nav-w: 218px;
}

html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.45 var(--sans); }
* { box-sizing: border-box; }

a { color: var(--accent); }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
textarea:focus-visible, [tabindex]:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 1px;
}

/* ------------------------------------------------------------------ shell */

.shell { display: flex; align-items: stretch; min-height: 100vh; }

.nav {
  width: var(--nav-w); flex: 0 0 var(--nav-w);
  background: var(--panel); border-right: 1px solid var(--line);
  padding: 14px 10px 24px; position: sticky; top: 0; height: 100vh; overflow-y: auto;
}
.nav h1 { font-size: 17px; margin: 2px 6px 4px; letter-spacing: .01em; }
.nav .sub { font-size: 12px; color: var(--muted); margin: 0 6px 14px; }
.nav ul { list-style: none; margin: 0; padding: 0; }
.nav li { margin: 1px 0; }
.nav a {
  display: flex; gap: 8px; align-items: center; justify-content: space-between;
  padding: 8px 10px; border-radius: 7px; color: var(--ink); text-decoration: none; font-size: 15px;
}
.nav a:hover { background: var(--panel-2); }
.nav a[aria-current="page"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.nav a[aria-current="page"] .count { background: rgba(255, 255, 255, .24); color: #fff; }
.count {
  font-size: 12px; font-variant-numeric: tabular-nums; background: var(--chip);
  border-radius: 999px; padding: 1px 7px; color: var(--ink-soft);
}
.count.hot { background: var(--err); color: #fff; }
.nav .navfoot { margin: 16px 6px 0; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line-soft); padding-top: 10px; }
.nav .navfoot div { margin: 3px 0; }

.main { flex: 1 1 auto; min-width: 0; padding: 18px 22px 64px; }
.view-head { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: baseline; margin: 0 0 12px; }
.view-head h2 { font-size: 22px; margin: 0; }
.view-head .hint { color: var(--muted); font-size: 14px; }
.spacer { flex: 1 1 auto; }

/* ------------------------------------------------------------- primitives */

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 0 0 16px; }
.panel > h3 { margin: 0 0 10px; font-size: 16px; }
.panel > h3 .hint { font-weight: 400; }
.grid { display: grid; gap: 12px 18px; }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.row { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
.row.tight { gap: 4px 8px; }
.stack { display: flex; flex-direction: column; gap: 4px; }
.hint { color: var(--muted); font-size: 13px; }
.mono { font-family: var(--mono); font-size: 13px; }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.num { font-variant-numeric: tabular-nums; text-align: right; }
.pad { padding: 14px 16px; }

label.field { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--muted); }
label.field > span.lab { font-weight: 600; color: var(--ink-soft); }
label.inline { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }

input[type=text], input[type=search], select, textarea {
  font: inherit; color: var(--ink); background: #fff;
  border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0;
}
textarea { resize: vertical; min-height: 72px; line-height: 1.4; }
input[readonly] { background: var(--panel-2); color: var(--ink-soft); }
input.stat { width: 6.5em; text-align: right; font-variant-numeric: tabular-nums; }
input.wide, textarea.wide, select.wide { width: 100%; }

button {
  font: inherit; background: var(--panel); color: var(--ink); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 12px; cursor: pointer;
}
button:hover { background: var(--panel-2); }
button:disabled { opacity: .5; cursor: not-allowed; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.primary:hover { background: #123f5d; }
button.danger { color: var(--err); border-color: #e0b6b2; }
button.small { padding: 2px 8px; font-size: 13px; }
button.step { padding: 2px 7px; font-size: 13px; font-family: var(--mono); }
button.link { background: none; border: none; color: var(--accent); padding: 2px 4px; text-decoration: underline; }

.chip {
  display: inline-flex; align-items: center; gap: 5px; background: var(--chip);
  border: 1px solid var(--line-soft); border-radius: 999px; padding: 1px 9px; font-size: 13px; white-space: nowrap;
}
.chip.class { font-weight: 700; font-family: var(--mono); letter-spacing: .03em; }
.chip.tab { background: var(--accent-soft); border-color: #c9dcea; }
.chip button { border: none; background: none; padding: 0 0 0 2px; font-size: 14px; line-height: 1; cursor: pointer; color: var(--err); }
.chip.kind-move { background: var(--info-bg); border-color: #c9dcea; }
.chip.kind-passive { background: var(--ok-bg); border-color: #c3ddcc; }
.chip.kind-unresolved { background: var(--err-bg); border-color: #e5bdb8; color: var(--err); font-weight: 600; }
.chip.kind-empty { background: var(--panel-2); color: var(--muted); }

.sev { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; border-radius: 5px; padding: 0 6px; white-space: nowrap; }
.sev-error { background: var(--err-bg); color: var(--err); }
.sev-warning { background: var(--warn-bg); color: var(--warn); }
.sev-info { background: var(--info-bg); color: var(--info); }
.sev-ok { background: var(--ok-bg); color: var(--ok); }
.sev .ic { font-family: var(--mono); }

.issue-list { list-style: none; margin: 6px 0 0; padding: 0; }
.issue-list li { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; border-top: 1px solid var(--line-soft); font-size: 14px; }
.issue-list li:first-child { border-top: none; }
.issue-list .code { font-family: var(--mono); font-size: 12px; color: var(--muted); }

.glyph { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.glyph.stale { color: var(--err); font-weight: 700; }
.tiermark { font-family: var(--mono); font-size: 11px; color: var(--accent); }
.tiermark.t3 { color: var(--focus); }

/* ------------------------------------------------------------------ table */

.tablewrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-height: 74vh; }
table.grid-table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
table.grid-table th, table.grid-table td { padding: 5px 9px; border-bottom: 1px solid var(--line-soft); text-align: left; vertical-align: top; }
table.grid-table thead th {
  position: sticky; top: 0; z-index: 2; background: var(--panel-2);
  border-bottom: 2px solid var(--line); font-size: 13px; white-space: nowrap;
}
table.grid-table thead th button.sort { background: none; border: none; padding: 2px 0; font: inherit; font-weight: 700; cursor: pointer; color: var(--ink); }
table.grid-table thead th button.sort:hover { text-decoration: underline; }
table.grid-table tbody tr:hover { background: var(--panel-2); }
table.grid-table tr.grouphead td { background: var(--accent-soft); font-weight: 700; }
table.grid-table td.num, table.grid-table th.num { text-align: right; font-variant-numeric: tabular-nums; }
table.grid-table td.name { font-weight: 600; }
table.grid-table caption { caption-side: top; text-align: left; padding: 8px 9px; color: var(--muted); font-size: 13px; }

.scale-0 { background: #f7e5e2; }
.scale-1 { background: #fcf1ef; }
.scale-2 { background: transparent; }
.scale-3 { background: #eef5ee; }
.scale-4 { background: #dcedde; }

/* -------------------------------------------------------------- stat grid */

.statgrid { display: grid; grid-template-columns: minmax(120px, max-content) auto auto auto auto; gap: 6px 14px; align-items: center; }
.statgrid .hd { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.statgrid .nm { font-weight: 600; }

.slotrow { display: grid; grid-template-columns: 110px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line-soft); }
.slotrow:first-of-type { border-top: none; }
.slotrow .sl { font-weight: 600; }

/* ----------------------------------------------------------------- dialog */

dialog.ffx {
  border: 1px solid var(--line); border-radius: 12px; padding: 0; width: min(780px, 94vw);
  max-height: 86vh; background: var(--panel); color: var(--ink); box-shadow: var(--shadow);
}
dialog.ffx::backdrop { background: rgba(31, 29, 26, .38); }
dialog.ffx .dlg-head { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
dialog.ffx .dlg-head h3 { margin: 0; font-size: 17px; }
dialog.ffx .dlg-body { padding: 12px 16px; overflow: auto; max-height: 58vh; }
dialog.ffx .dlg-foot { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.picker { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 260px); gap: 14px; }
.picker .list { max-height: 46vh; overflow: auto; border: 1px solid var(--line-soft); border-radius: 8px; }
.picker .grp { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 6px 10px; background: var(--panel-2); }
.picker .opt { display: flex; gap: 8px; justify-content: space-between; align-items: center; width: 100%; text-align: left; border: none; background: none; padding: 5px 10px; cursor: pointer; border-radius: 0; }
.picker .opt:hover { background: var(--accent-soft); }
.picker .opt[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.picker .opt[aria-selected="true"] .hint { color: #e6eef4; }
.picker .detail { border: 1px solid var(--line-soft); border-radius: 8px; padding: 10px; font-size: 14px; background: var(--panel-2); }
.picker .detail h4 { margin: 0 0 6px; font-size: 15px; }

/* ----------------------------------------------------------------- toasts */

#ffx-toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 40; max-width: min(420px, 90vw); }
.toast { background: var(--panel); border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 8px; padding: 9px 13px; box-shadow: var(--shadow); font-size: 14px; }
.toast.err { border-left-color: var(--err); }
.toast.warn { border-left-color: var(--warn); }
.toast.ok { border-left-color: var(--ok); }

.banner { border: 1px solid var(--line); border-left: 5px solid var(--accent); background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; margin: 0 0 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.banner.warn { background: var(--warn-bg); border-left-color: var(--warn); }
.banner.err { background: var(--err-bg); border-left-color: var(--err); }

/* ------------------------------------------------------------------- misc */

.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.tokenbadges { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.legend { font-size: 13px; color: var(--muted); }
.legend code { font-family: var(--mono); background: var(--chip); padding: 0 4px; border-radius: 3px; }
.helpbody h3 { margin: 20px 0 6px; font-size: 17px; }
.helpbody p, .helpbody li { max-width: 74ch; }
.helpbody table { border-collapse: collapse; font-size: 14px; margin: 8px 0; }
.helpbody th, .helpbody td { border: 1px solid var(--line); padding: 4px 9px; text-align: left; vertical-align: top; }
.helpbody th { background: var(--panel-2); }
.selftest { font-family: var(--mono); font-size: 13px; white-space: pre-wrap; padding: 16px; }
#selftest-result { font-family: var(--mono); font-size: 16px; font-weight: 700; padding: 0 16px 16px; }

/* ------------------------------------------------------------------ print */

@media print {
  :root { --bg: #fff; }
  body { background: #fff; font-size: 11px; }
  .nav, .noprint, #ffx-toasts, button, .banner { display: none !important; }
  .main { padding: 0; }
  .tablewrap { max-height: none; border: none; overflow: visible; }
  table.grid-table { font-size: 10px; }
  table.grid-table thead th { position: static; border-bottom: 1px solid #000; }
  table.grid-table tr { break-inside: avoid; }
  .panel { border: none; padding: 0; }
}


</style>

  const REVIVE_NAMES = ['raise', 'improved raise', 'improve raise', 'life', 'full life'];
  const HEAL_NAMES = ['cure', 'cura', 'curaja', 'curaga'];

  // Keyword-token legend (MovesImporter.ApplyDerivedFields + ClassifySupportMove).
  // `suffixes` = letter suffixes that still count as the intended word for the
  // accidental-match check (the importer itself matches the raw substring).
  const TOKENS = [
    { token: 'N turn(s)', key: 'turns', field: 'appliedStatusDurationOverride', desc: 'Status duration override ("3 turns", "two turns"). 0 = each effect\'s default.' },
    { token: 'draw', key: 'draw', field: 'cardDraw + numberOfCardsToDraw', desc: 'Card draw; a count right after ("draw 2", "draw two") sets how many (default 1).', suffixes: ['', 's', 'n', 'ing'] },
    { token: 'N% chance', key: 'chance', field: 'statusHasPercent + percentChance', desc: 'Percent chance the listed statuses land ("50% chance"; the CSV typo "change" also counts). Ignored without statuses.' },
    { token: 'agility based', key: 'agility based', field: 'usesAgility', desc: 'Extra agility strikes (FFT Unarmed Strike).', suffixes: [''] },
    { token: 'ranged', key: 'ranged', field: 'isRanged', desc: 'Ranged attack (arrows/thrown) — ranged-only reactions and melee-only counters key off this.', suffixes: [''] },
    { token: 'reusable', key: 'reusable', field: 'reusableTechnique', desc: 'Technique exempt from once-per-match.', suffixes: ['', 's'] },
    { token: 'break damage limit', key: 'break damage limit', field: 'breakDamageLimit', desc: 'Hits clamp to 99999 instead of 9999.', suffixes: [''] },
    { token: 'N use limit', key: 'use limit', field: 'usesPerBattle', desc: 'Per-battle use cap ("3 use limit").' },
    { token: 'true damage', key: 'true damage', field: 'trueDamage', desc: 'Ignores DEF/MDEF and elemental wards.', suffixes: [''] },
    { token: 'combo', key: 'combo', field: 'comboStackable', desc: 'Stackable in planning (same move queued again). Note "combos" is an accidental hit.', suffixes: [''] },
    { token: 'chainable', key: 'chainable', field: 'comboChainable', desc: 'Combo FOLLOW-UP: may be queued once after an opener.', suffixes: ['', 's'] },
    { token: 'opener', key: 'opener', field: 'comboOpener', desc: 'Combo OPENER: starts a combo that accepts one follow-up.', suffixes: ['', 's'] },
    { token: 'basic attack', key: 'basic attack', field: 'isBasicAttack', desc: 'This move IS the character\'s basic attack (Martial Arts / Doublehand gate).', suffixes: ['', 's'] },
    { token: 'N ammo', key: 'ammo', field: 'ammoCost', desc: 'Ammo spent when the move fires ("3 ammo").' },
    { token: 'launch', key: 'launch', field: 'launchOnStagger', desc: 'Staggered targets hit by this move are launched (skip next action).', suffixes: ['', 'es', 'ing'] },
    { token: 'strategem', key: 'strategem', field: 'isStrategem', desc: 'Scholar instant-cast during planning (also silences the "imports as DATA" note).', suffixes: ['', 's'] },
    { token: 'fullkit', key: 'fullkit', field: 'requiresFullKit', desc: 'Usable only with a maxed weapon and all four equip slots unlocked.', suffixes: [''] },
    { token: 'discards X|Circle|Square|Triangle', key: 'discards', field: 'requiredDiscardType', desc: 'The card-cost payment must be an equip card of that shape.' },
    { token: 'revive', key: 'revive', field: 'revive + reviveHealthPercentage', desc: 'Imports as a revive heal aimed at allies; fraction from "full", "1/8", "1/4", "1/2"/"50%"/"half" (default 1/2).', suffixes: ['', 's', 'd', 'ing'] },
    { token: 'heal', key: 'heal', field: 'moveType = Heal (classify)', desc: 'ANY "heal" substring in Additional (even inside "health") reclassifies a non-custom move as an ally Heal — the gotcha.', suffixes: ['', 's', 'ing', 'ed'] },
  ];

  // ------------------------------------------------------------ canonicalizers

  const WS_RE = /\s+/g;
  const ILLEGAL_FILE_RE = /[<>:"/\\|?*]/g;

  // NameCanonicalizer.Canonicalize — trim + collapse internal whitespace (the hard rule).
  function canon(s) {
    if (s == null) return '';
    s = String(s);
    if (s.length === 0) return '';
    return s.trim().replace(WS_RE, ' ');
  }

  // DevModeValidation.Canon — drop whitespace, '-', '\'', ':'; lower-case. Hints only.
  function devCanon(s) {
    if (s == null) return '';
    return String(s).replace(/[\s\-':]/g, '').toLowerCase();
  }

  // NameCanonicalizer.SafeFileName
  function safeFile(s) { return canon(s).replace(ILLEGAL_FILE_RE, '_'); }

  function charKey(name, cls) { return canon(name) + '|' + String(cls == null ? '' : cls).trim().toUpperCase(); }
  function keyLower(key) { return String(key == null ? '' : key).toLowerCase(); }
  function nameKey(name) { return canon(name); }
  function displayLabel(name, cls) {
    const c = String(cls == null ? '' : cls).trim();
    return canon(name) + (c ? ' (' + c + ')' : '');
  }
  function fileKeyColumns(file) { return file === CHARACTERS ? ['CharName', 'Class'] : ['Name']; }
  function rowKey(file, table, rowRef) {
    if (file === CHARACTERS) return charKey(csv.get(table, rowRef, 'CharName'), csv.get(table, rowRef, 'Class'));
    return nameKey(csv.get(table, rowRef, 'Name'));
  }
  function rowLabel(file, table, rowRef) {
    if (file === CHARACTERS) return displayLabel(csv.get(table, rowRef, 'CharName'), csv.get(table, rowRef, 'Class'));
    return canon(csv.get(table, rowRef, 'Name'));
  }
  function isTruthy(raw) { return TRUTHY.indexOf(String(raw == null ? '' : raw).trim().toLowerCase()) >= 0; }
  function isIntText(s) { return /^[+-]?\d+$/.test(String(s == null ? '' : s).trim()); }

  // Accepted spelling (upper) → code. From vocab.classes[{code, label, accepted[]}] when present.
  const _classCache = new WeakMap();
  function classAliases(vocab) {
    if (!vocab || !Array.isArray(vocab.classes) || vocab.classes.length === 0) return CLASS_ALIASES;
    if (_classCache.has(vocab)) return _classCache.get(vocab);
    const m = {};
    for (const c of vocab.classes) {
      const code = typeof c === 'string' ? c : (c && c.code);
      if (!code) continue;
      m[String(code).toUpperCase()] = String(code).toUpperCase();
      const acc = (c && Array.isArray(c.accepted)) ? c.accepted : [];
      for (const a of acc) m[String(a).toUpperCase()] = String(code).toUpperCase();
    }
    _classCache.set(vocab, m);
    return m;
  }
  function classLabel(code, vocab) {
    if (vocab && Array.isArray(vocab.classes)) for (const c of vocab.classes) if (c && c.code === code && c.label) return c.label;
    return CLASS_NAMES[code] || code;
  }

  // ClassCodeMap.FromCode → { code: 'COM'|..|'' , recognized }
  function mapClass(raw, vocab) {
    const code = String(raw == null ? '' : raw).trim().toUpperCase();
    if (code === '') return { code: '', recognized: false };
    const mapped = classAliases(vocab)[code];
    return mapped ? { code: mapped, recognized: true } : { code: '', recognized: false };
  }

  // --------------------------------------------------------- asset-name rule

  // CharactersImporter.Run: the FIRST row of a canonical name (case-insensitive) owns
  // "<Name>.asset"; later rows get "<Name> (<CLASS>).asset"; a blank class always writes
  // "<Name>.asset". One entry per row (null for blank-name rows).
  function assetNames(table) {
    const out = [];
    const seen = new Set();
    for (let r = 0; r < table.rows.length; r++) {
      const c = canon(csv.get(table, r, 'CharName'));
      if (!c) { out.push(null); continue; }
      const cls = String(csv.get(table, r, 'Class')).trim();
      const low = c.toLowerCase();
      const isFirst = !seen.has(low);
      seen.add(low);
      const name = (isFirst || !cls) ? c : c + ' (' + cls + ')';
      out.push({ rowIdx: r, name, canon: c, cls, isFirst, file: safeFile(name) + '.asset' });
    }
    return out;
  }

  // ------------------------------------------------------------ move aliases

  function aliasTable(vocab) {
    const src = (vocab && vocab.slotAliases && typeof vocab.slotAliases === 'object') ? vocab.slotAliases : MOVE_ALIASES;
    const m = new Map();
    for (const k of Object.keys(src)) m.set(k.toLowerCase(), src[k]);
    return m;
  }
  // CharactersImporter.AliasMoveName — case-insensitive lookup of the canonical name.
  // Applies to MOVE lookups only (never to passives).
  function aliasMove(name, vocab) {
    if (!name) return name == null ? '' : name;
    const m = aliasTable(vocab);
    const hit = m.get(String(name).toLowerCase());
    return hit == null ? name : hit;
  }
  function isAliasSource(name, vocab) { return aliasTable(vocab).has(canon(name).toLowerCase()); }

  // --------------------------------------------------------- TargetMap ports

  // TargetMap.MapTarget — ordered substring chain; blank → default Single/Opponent, unrecognized.
  function mapTarget(raw) {
    const s = String(raw == null ? '' : raw).trim().toLowerCase();
    if (!s) return { shape: 'Single', side: 'Opponent', recognized: false, blank: true };
    for (const rule of TARGET_CHAIN) {
      for (const needle of rule.any) {
        if (s.indexOf(needle) >= 0) return { shape: rule.shape, side: rule.side, recognized: true, blank: false };
      }
    }
    return { shape: 'Single', side: 'Opponent', recognized: false, blank: false };
  }

  // TargetMap.MapMoveType — exact (trimmed, lower) match.
  function mapMoveType(raw) {
    const s = String(raw == null ? '' : raw).trim().toLowerCase();
    switch (s) {
      case '': return { type: 'None', recognized: false, blank: true };
      case 'physical': return { type: 'Physical', recognized: true, blank: false };
      case 'magic': case 'magical': return { type: 'Magic', recognized: true, blank: false };
      case 'heal': case 'healing': return { type: 'Heal', recognized: true, blank: false };
      case 'buff': case 'support': return { type: 'Buff', recognized: true, blank: false };
      case 'ultimate': return { type: 'Ultimate', recognized: true, blank: false };
      case 'technique': case 'learntechnique': return { type: 'LearnTechnique', recognized: true, blank: false };
      case 'skill': case 'physical skill': return { type: 'Physical', recognized: true, blank: false };
      case 'other': return { type: 'Other', recognized: true, blank: false };
      default: return { type: 'None', recognized: false, blank: false };
    }
  }

  // TargetMap.MapElement — "-" and "none" are recognized None; blank is unrecognized None
  // (the importer only warns when the cell is non-blank and not "-").
  function mapElement(raw) {
    const s = String(raw == null ? '' : raw).trim().toLowerCase();
    if (s === '') return { element: 'None', recognized: false, blank: true };
    if (s === '-' || s === 'none') return { element: 'None', recognized: true, blank: false };
    switch (s) {
      case 'earth': return { element: 'Earth', recognized: true, blank: false };
      case 'fire': return { element: 'Fire', recognized: true, blank: false };
      case 'frost': case 'ice': case 'water/ice': return { element: 'Frost', recognized: true, blank: false };
      case 'holy': case 'light': return { element: 'Holy', recognized: true, blank: false };
      case 'lightning': case 'thunder': return { element: 'Lightning', recognized: true, blank: false };
      case 'water': return { element: 'Water', recognized: true, blank: false };
      case 'wind': case 'air': case 'aero': return { element: 'Wind', recognized: true, blank: false };
      default: return { element: 'None', recognized: false, blank: false };
    }
  }

  // MovesImporter multiplier: trim, optional x/X, then float.TryParse. Dev Mode's regex
  // is the stricter designer-facing rule; the importer silently falls back to x1.0.
  const MULT_RE = /^[xX]?\d+(\.\d+)?$/;
  function multiplierValid(raw) {
    const s = String(raw == null ? '' : raw).trim();
    if (s.length === 0) return true;
    return MULT_RE.test(s);
  }
  function parseMultiplier(raw) {
    let s = String(raw == null ? '' : raw).trim();
    if (s && (s[0] === 'x' || s[0] === 'X')) s = s.slice(1);
    const v = MULT_RE.test('x' + s) ? parseFloat(s) : NaN;
    return isNaN(v) ? 1 : v;
  }

  // ------------------------------------------------------ StatusAliasMap ports

  // StatusAliasMap.Norm — lower, trim, split on ' ' and '\t' ONLY, drop empties, join ' '.
  function normStatus(s) {
    if (s == null) return '';
    s = String(s);
    if (s.trim().length === 0) return '';
    return s.trim().toLowerCase().split(/[ \t]+/).filter(Boolean).join(' ');
  }

  const _statusTableCache = new WeakMap();
  function statusTables(vocab) {
    const key = vocab && typeof vocab === 'object' ? vocab : null;
    if (key && _statusTableCache.has(key)) return _statusTableCache.get(key);
    const aliasSrc = (key && key.statusAliases && typeof key.statusAliases === 'object') ? key.statusAliases : STATUS_ALIASES;
    const ignoreSrc = (key && Array.isArray(key.statusIgnore)) ? key.statusIgnore : STATUS_IGNORE;
    const buffSrc = (key && Array.isArray(key.statusBuffs)) ? key.statusBuffs : STATUS_BUFFS;
    const aliases = new Map();
    for (const k of Object.keys(aliasSrc)) {
      const v = aliasSrc[k];
      aliases.set(k, Array.isArray(v) ? v.slice() : [String(v)]);
    }
    const ignore = new Set(ignoreSrc.map((x) => String(x)));
    const buffs = new Set(buffSrc.map((x) => String(x).toLowerCase()));
    const t = { aliases, ignore, buffs };
    if (key) _statusTableCache.set(key, t);
    return t;
  }

  // StatusAliasMap.SplitTokens — whole-cell alias first (after ';'→','), else split on , and ;
  function splitStatusTokens(cell, vocab) {
    const raw = cell == null ? '' : String(cell);
    if (raw.trim().length === 0) return [];
    const t = statusTables(vocab);
    const whole = normStatus(raw.replace(/;/g, ','));
    if (t.aliases.has(whole)) return [raw.trim()];
    return raw.split(/[,;]/).map((p) => p.trim()).filter((p) => p.length > 0);
  }

  // StatusAliasMap.Resolve — one token → { canonical: [...], kind }
  function resolveStatus(token, vocab) {
    const t = statusTables(vocab);
    const n = normStatus(token);
    if (n === '' || t.ignore.has(n)) return { raw: token, norm: n, canonical: [], kind: n === '' ? 'empty' : 'ignored' };
    if (t.aliases.has(n)) return { raw: token, norm: n, canonical: t.aliases.get(n).slice(), kind: 'alias' };
    return { raw: token, norm: n, canonical: [String(token).trim()], kind: 'passthrough' };
  }

  // Whole cell → per-token resolutions + distinct canonical names (importer order).
  function resolveStatuses(cell, vocab) {
    const tokens = splitStatusTokens(cell, vocab).map((tok) => resolveStatus(tok, vocab));
    const names = [];
    for (const r of tokens) for (const c of r.canonical) if (names.indexOf(c) < 0) names.push(c);
    tokens.names = names;
    return tokens;
  }

  function isBuffStatus(name, vocab) { return !!name && statusTables(vocab).buffs.has(String(name).toLowerCase()); }
  function allBuffs(names, vocab) {
    if (!names || names.length === 0) return false;
    for (const n of names) if (!isBuffStatus(n, vocab)) return false;
    return true;
  }
  // StatusAliasMap.TagsHeal — raw status cell contains "heal".
  function tagsHeal(raw) { return !!raw && String(raw).toLowerCase().indexOf('heal') >= 0; }

  // Runtime status canon (84 effectName values) from vocab.statuses; tolerant of shapes.
  function statusNameSet(vocab) {
    const set = new Set();
    const list = vocab && Array.isArray(vocab.statuses) ? vocab.statuses : [];
    for (const s of list) {
      const n = typeof s === 'string' ? s : (s && (s.effectName || s.name));
      if (n) set.add(String(n).trim().toLowerCase());
    }
    return set;
  }

  // ------------------------------------------------------------ token parsing

  // MovesImporter.ParseDuration
  function parseDuration(text) {
    if (text.indexOf('turn') < 0) return 0;
    const words = ['one', 'two', 'three', 'four', 'five'];
    for (let i = 0; i < words.length; i++) if (text.indexOf(words[i] + ' turn') >= 0) return i + 1;
    for (let d = 1; d <= 9; d++) if (text.indexOf(d + ' turn') >= 0) return d;
    return 0;
  }
  // MovesImporter.ParseChancePercent — only "N% chance" / "N% change"
  function parseChancePercent(text) {
    for (const marker of ['% chance', '% change']) {
      const m = text.indexOf(marker);
      if (m <= 0) continue;
      let start = m;
      while (start > 0 && text[start - 1] >= '0' && text[start - 1] <= '9') start--;
      if (start < m) { const v = parseInt(text.slice(start, m), 10); if (!isNaN(v)) return v; }
    }
    return 0;
  }
  // MovesImporter.ParseLeadingCount
  function parseLeadingCount(text, after) {
    const i = text.indexOf(after);
    if (i < 0) return 1;
    const rest = text.slice(i + after.length).replace(/^\s+/, '');
    if (rest.startsWith('two')) return 2;
    if (rest.startsWith('three')) return 3;
    for (let d = 1; d <= 9; d++) if (rest.startsWith(String(d))) return d;
    return 1;
  }
  // MovesImporter.ParseRevivePct
  function parseRevivePct(addLower) {
    if (addLower.indexOf('full') >= 0) return 1;
    if (addLower.indexOf('1/8') >= 0) return 0.125;
    if (addLower.indexOf('1/4') >= 0) return 0.25;
    if (addLower.indexOf('1/2') >= 0 || addLower.indexOf('50%') >= 0 || addLower.indexOf('half') >= 0) return 0.5;
    return 0.5;
  }

  function isLetter(ch) { return ch !== undefined && ch >= 'a' && ch <= 'z'; }
  // True when `word` occurs with a non-letter (or edge) on the left and, after one of the
  // allowed suffixes, a non-letter (or edge) on the right.
  function hasBoundedWord(text, word, suffixes) {
    let from = 0;
    for (;;) {
      const i = text.indexOf(word, from);
      if (i < 0) return false;
      if (!isLetter(text[i - 1])) {
        for (const suf of suffixes) {
          const end = i + word.length + suf.length;
          if (text.slice(i + word.length, end) === suf && !isLetter(text[end])) return true;
        }
      }
      from = i + 1;
    }
  }

  // MovesImporter.ApplyDerivedFields (+ ClassifySupportMove's revive/heal text checks).
  // Text = Additional + " " + status cell, lower-cased, exactly as the importer builds it.
  // Returns { tokens: [{token, key, field, value?}], accidental: [{token, key, hit}] }.
  function parseTokens(additional, statusCell) {
    const add = String(additional == null ? '' : additional).toLowerCase();
    const text = add + ' ' + String(statusCell == null ? '' : statusCell).toLowerCase();
    const tokens = [];
    const accidental = [];
    const byKey = {};
    for (const t of TOKENS) byKey[t.key] = t;

    function plain(key, value) {
      const t = byKey[key];
      if (text.indexOf(key) < 0) return;
      const entry = { token: t.token, key, field: t.field };
      if (value !== undefined) entry.value = value;
      tokens.push(entry);
      if (t.suffixes && !hasBoundedWord(text, key, t.suffixes)) accidental.push({ token: t.token, key, field: t.field });
    }

    const dur = parseDuration(text);
    if (dur > 0) tokens.push({ token: 'N turn(s)', key: 'turns', field: byKey.turns.field, value: dur });
    if (text.indexOf('draw') >= 0) plain('draw', Math.max(1, parseLeadingCount(text, 'draw')));
    const pct = parseChancePercent(text);
    if (pct > 0) tokens.push({ token: 'N% chance', key: 'chance', field: byKey.chance.field, value: pct });
    plain('agility based');
    plain('ranged');
    plain('reusable');
    plain('break damage limit');
    const useLimit = /(\d+)\s*use limit/.exec(text);
    if (useLimit) tokens.push({ token: 'N use limit', key: 'use limit', field: byKey['use limit'].field, value: parseInt(useLimit[1], 10) });
    plain('true damage');
    plain('combo');
    plain('chainable');
    plain('opener');
    plain('basic attack');
    const ammo = /(\d+)\s*ammo/.exec(text);
    if (ammo) tokens.push({ token: 'N ammo', key: 'ammo', field: byKey.ammo.field, value: parseInt(ammo[1], 10) });
    plain('launch');
    plain('strategem');
    plain('fullkit');
    for (const shape of ['x', 'circle', 'square', 'triangle']) {
      if (text.indexOf('discards ' + shape) >= 0) { tokens.push({ token: byKey.discards.token, key: 'discards', field: byKey.discards.field, value: shape.charAt(0).toUpperCase() + shape.slice(1) }); break; }
    }
    // ClassifySupportMove reads Additional only for these two.
    if (add.indexOf('revive') >= 0) {
      tokens.push({ token: 'revive', key: 'revive', field: byKey.revive.field, value: parseRevivePct(add) });
      if (!hasBoundedWord(add, 'revive', byKey.revive.suffixes)) accidental.push({ token: 'revive', key: 'revive', field: byKey.revive.field });
    }
    if (add.indexOf('heal') >= 0) {
      tokens.push({ token: 'heal', key: 'heal', field: byKey.heal.field });
      if (!hasBoundedWord(add, 'heal', byKey.heal.suffixes)) accidental.push({ token: 'heal', key: 'heal', field: byKey.heal.field });
    }
    return { tokens, accidental };
  }

  // ------------------------------------------------------------ known names

  function listNames(list) {
    const out = [];
    if (!Array.isArray(list)) return out;
    for (const e of list) {
      const n = typeof e === 'string' ? e : (e && (e.name || e.moveName || e.passiveName));
      if (n) out.push({ name: String(n), entry: typeof e === 'string' ? null : e });
    }
    return out;
  }

  // Live sets computed from the tables + the bundle's baked asset names.
  //   moves: Set(lower canon)  moveNames: Map(lower → display)  techniques: Set(lower)
  //   passives / passiveNames likewise; placeholderMoves: Set(lower) of PLACEHOLDER rows
  //   usedBy: Map(lower canon → [{rowIdx, slot, raw}]) keyed by the raw canon AND its alias
  //   handlers: Map(lower canon move name → handler id)
  function knownSets(tables, vocab) {
    const moveNames = new Map(), passiveNames = new Map();
    const moves = new Set(), techniques = new Set(), passives = new Set(), placeholderMoves = new Set();
    const csvMoves = new Set(), csvPassives = new Set();
    const addName = (map, set, name) => {
      const c = canon(name); if (!c) return;
      const low = c.toLowerCase();
      if (!map.has(low)) map.set(low, c);
      set.add(low);
    };
    const mt = tables && tables[MOVES], tt = tables && tables[TECHNIQUES], pt = tables && tables[PASSIVES], ct = tables && tables[CHARACTERS];
    if (mt) for (let r = 0; r < mt.rows.length; r++) {
      const row = mt.rows[r];
      const c = canon(csv.get(mt, row, 'Name'));
      if (!c) continue;
      addName(moveNames, moves, c); csvMoves.add(c.toLowerCase());
      for (const cell of row) if (cell && String(cell).toLowerCase().indexOf('placeholder') >= 0) { placeholderMoves.add(c.toLowerCase()); break; }
    }
    if (tt) for (let r = 0; r < tt.rows.length; r++) {
      const c = canon(csv.get(tt, r, 'Name'));
      if (!c) continue;
      addName(moveNames, moves, c); techniques.add(c.toLowerCase()); csvMoves.add(c.toLowerCase());
    }
    if (pt) for (let r = 0; r < pt.rows.length; r++) {
      const c = canon(csv.get(pt, r, 'Name'));
      if (!c) continue;

    }
    const handlers = new Map();
    const bakedMoves = new Set(), bakedPassives = new Set();
    for (const { name, entry } of listNames(vocab && vocab.bakedMoves)) {
      addName(moveNames, moves, name); bakedMoves.add(canon(name).toLowerCase());
      // registryHandler = CustomMoveRegistry (import-time truth); handler = the asset's current field.
      const h = entry && (entry.registryHandler || entry.handler || entry.customMoveHandler);
      if (h) handlers.set(canon(name).toLowerCase(), String(h));
    }

    for (const cell of row) if (cell && String(cell).toLowerCase().indexOf('placeholder') >= 0) return true;
    return false;
  }

  function rowLink(cfg, t, r) {
    return cfg.item + encodeURIComponent(S.nameKey(csv.get(t, r, 'Name')) + '@' + (r + 2));
  }

  // ------------------------------------------------------------------ list

  function renderList(rootEl, ctx, cfg) {
    const t = ctx.model.tables[cfg.file];
    const s = st(ctx, cfg.file);
    const statusCol = S.STATUS_COL[cfg.file];
    const rows = [];
    for (let r = 0; r < t.rows.length; r++) {
      if (csv.isBlankRow(t.rows[r])) continue;
      const name = S.canon(csv.get(t, r, 'Name'));
      const counts = V.counts(V.forRow(ctx.issues, cfg.file, r));
      const used = usedCount(ctx, name);
      rows.push({
        r, line: r + 2, name, cost: csv.get(t, r, 'Cost'), target: csv.get(t, r, 'Target'),
        type: csv.get(t, r, 'Type'), element: csv.get(t, r, 'Element'), statuses: csv.get(t, r, statusCol),
        placeholder: isPlaceholderRow(t, r), used, counts,
      });
    }
    const types = Array.from(new Set(rows.map((x) => x.type.trim()))).sort();
    const elements = Array.from(new Set(rows.map((x) => x.element.trim()))).sort();

    const q = S.devCanon(s.q);
    let view = rows.filter((x) => {
      if (q && S.devCanon(x.name + x.statuses + x.type).indexOf(q) < 0) return false;
      if (s.type && x.type.trim() !== s.type) return false;
      if (s.element && x.element.trim() !== s.element) return false;
      if (s.placeholder && !x.placeholder) return false;
      if (s.unused && x.used > 0) return false;
      if (s.issues && (x.counts.error + x.counts.warning) === 0) return false;
      return true;
    });
    const cmp = (a, b) => {
      let av, bv;
      if (s.sort === 'name') { av = a.name.toLowerCase(); bv = b.name.toLowerCase(); }
      else if (s.sort === 'cost') { av = parseInt(a.cost, 10) || 0; bv = parseInt(b.cost, 10) || 0; }
      else if (s.sort === 'used') { av = a.used; bv = b.used; }
      else if (s.sort === 'issues') { av = a.counts.error * 100 + a.counts.warning; bv = b.counts.error * 100 + b.counts.warning; }
      else if (s.sort === 'type') { av = a.type; bv = b.type; }
      else if (s.sort === 'element') { av = a.element; bv = b.element; }
      else { av = a.line; bv = b.line; }
      if (av < bv) return -1 * s.dir;
      if (av > bv) return 1 * s.dir;
      return a.line - b.line;
    };
    view = view.slice().sort(cmp);

    const head = (key, label, extra) => {
      const active = s.sort === key;
      return h('th', { class: extra || null, 'aria-sort': active ? (s.dir > 0 ? 'ascending' : 'descending') : 'none' },
        h('button', { type: 'button', class: 'sort', 'data-action': 'moves.sort', 'data-key': key }, esc(label) + (active ? (s.dir > 0 ? ' ▲' : ' ▼') : '')));
    };

    const body = view.map((x) => h('tr', null, [
      h('td', { class: 'name' }, h('a', { href: rowLink(cfg, t, x.r), 'data-action': 'nav', 'data-href': rowLink(cfg, t, x.r) }, esc(x.name || '(blank name)'))),
      h('td', { class: 'num' }, esc(x.cost)),
      h('td', null, esc(x.target)),
      h('td', null, esc(x.type)),
      h('td', null, esc(x.element)),
      h('td', null, esc(x.statuses)),
      h('td', { class: 'num' }, x.used ? String(x.used) : h('span', { class: 'hint' }, '0')),
      h('td', null, [
        x.placeholder ? D.sev('warning', 'PLACEHOLDER') : '',
        x.counts.error ? D.sev('error', x.counts.error + ' Error' + (x.counts.error > 1 ? 's' : '')) : '',
        x.counts.warning ? D.sev('warning', x.counts.warning + ' Warning' + (x.counts.warning > 1 ? 's' : '')) : '',
        (!x.placeholder && !x.counts.error && !x.counts.warning) ? h('span', { class: 'hint' }, 'clean') : '',
      ].join(' ')),
    ]));

    rootEl.innerHTML = [
      h('div', { class: 'view-head' }, [
        h('h2', null, esc(cfg.title)),
        h('span', { class: 'hint' }, esc(view.length + ' of ' + rows.length + ' rows in ' + cfg.file)),
        h('span', { class: 'spacer' }, ''),
        h('button', { type: 'button', class: 'primary', 'data-action': 'moves.new' }, 'New ' + (cfg.hasDescription ? 'move' : 'technique')),
      ]),
      h('div', { class: 'panel' }, h('div', { class: 'row' }, [
        h('label', { class: 'field' }, [h('span', { class: 'lab' }, 'Search'),
          h('input', { type: 'search', value: s.q, 'data-focus-id': 'moves-q', 'data-action': 'moves.q', 'data-on': 'input', placeholder: 'name, status, type', 'aria-label': 'Search ' + cfg.title })]),
        h('label', { class: 'field' }, [h('span', { class: 'lab' }, 'Type'),
          h('select', { 'data-action': 'moves.type', 'data-on': 'change' }, [D.option('', 'Any type', s.type === '')].concat(types.map((x) => D.option(x, x === '' ? '(blank)' : x, s.type === x))))]),
        h('label', { class: 'field' }, [h('span', { class: 'lab' }, 'Element'),
          h('select', { 'data-action': 'moves.element', 'data-on': 'change' }, [D.option('', 'Any element', s.element === '')].concat(elements.map((x) => D.option(x, x === '' ? '(blank)' : x, s.element === x))))]),
        h('label', { class: 'inline' }, [h('input', { type: 'checkbox', checked: s.placeholder, 'data-action': 'moves.fPlaceholder', 'data-on': 'change' }), 'PLACEHOLDER only']),
        h('label', { class: 'inline' }, [h('input', { type: 'checkbox', checked: s.unused, 'data-action': 'moves.fUnused', 'data-on': 'change' }), 'Unused only']),
        h('label', { class: 'inline' }, [h('input', { type: 'checkbox', checked: s.issues, 'data-action': 'moves.fIssues', 'data-on': 'change' }), 'Has issues']),
        h('span', { class: 'spacer' }, ''),
        h('button', { type: 'button', 'data-action': 'moves.reset' }, 'Reset filters'),
      ])),
      h('div', { class: 'tablewrap', 'data-scroll-id': 'moves-table' }, h('table', { class: 'grid-table' }, [
        h('thead', null, h('tr', null, [head('name', 'Name'), head('cost', 'Cost', 'num'), head('line', 'Target'), head('type', 'Type'), head('element', 'Element'),
          h('th', null, esc(S.STATUS_COL[cfg.file])), head('used', 'Used by', 'num'), head('issues', 'Flags')])),
        h('tbody', null, body),
      ])),
    ].join('');
  }

  // ------------------------------------------------------------------ form

  function findRow(ctx, cfg, key) {
    const t = ctx.model.tables[cfg.file];
    let name = String(key || ''), line = 0;
    const at = name.lastIndexOf('@');
    if (at > 0) { line = parseInt(name.slice(at + 1), 10) || 0; name = name.slice(0, at); }
    if (line >= 2 && line - 2 < t.rows.length && S.canon(csv.get(t, line - 2, 'Name')).toLowerCase() === S.canon(name).toLowerCase()) return line - 2;
    const low = S.canon(name).toLowerCase();
    for (let r = 0; r < t.rows.length; r++) if (S.canon(csv.get(t, r, 'Name')).toLowerCase() === low) return r;
    if (line >= 2 && line - 2 < t.rows.length) return line - 2;
    return -1;
  }

  function statusChips(ctx, cell) {
    const res = S.resolveStatuses(cell, ctx.vocab);
    const canon = S.statusNameSet(ctx.vocab);
    const out = [];
    for (const tok of res) {
      if (tok.kind === 'empty') continue;
      if (tok.kind === 'ignored') { out.push(h('span', { class: 'chip' }, [esc(tok.raw), h('span', { class: 'hint' }, ' ignored')])); continue; }
      for (const c of tok.canonical) {
        const known = canon.size === 0 || canon.has(c.toLowerCase());
        out.push(h('span', { class: 'chip ' + (known ? 'kind-move' : 'kind-unresolved') }, [
          esc(c),
          tok.kind === 'alias' ? h('span', { class: 'hint' }, ' ← ' + esc(tok.raw)) : '',
          known ? '' : h('span', null, ' ' + esc('unknown')),
        ]));
      }
    }
    return out.length ? out.join(' ') : h('span', { class: 'hint' }, 'no statuses');
  }

  function tokenBadges(ctx, additional, statusCell, typeCell, name) {
    const parsed = S.parseTokens(additional, statusCell);
    const out = parsed.tokens.map((tk) => h('span', { class: 'chip kind-move', title: tk.field }, [
      esc(tk.token), tk.value !== undefined ? h('span', { class: 'hint' }, ' = ' + esc(String(tk.value))) : '',
    ]));
    const notes = [];
    const type = S.mapMoveType(typeCell).type;
    const handler = S.handlerFor(name, ctx.known);
    if (parsed.tokens.some((x) => x.key === 'heal') && type !== 'Heal' && !handler) {
      notes.push(h('p', null, D.sev('warning', 'Heal gotcha') + ' ' + esc('Any "heal" substring in Additional (even inside "health") reclassifies this move as an ally Heal on import, whatever Type says. Curse is the live example.')));
    }
    for (const acc of parsed.accidental) {
      notes.push(h('p', null, D.sev('info', 'Probably accidental') + ' ' + esc('the word "' + acc.key + '" is matched as a raw substring, so it fires the ' + acc.field + ' flag even inside a longer word.')));
    }
    return h('div', null, [h('div', { class: 'tokenbadges' }, out.length ? out : h('span', { class: 'hint' }, 'no keyword tokens recognized')), notes.join('')]);
  }

  function renderForm(rootEl, ctx, cfg) {
    const t = ctx.model.tables[cfg.file];
    const r = findRow(ctx, cfg, ctx.route.key);
    if (r < 0) {
      rootEl.innerHTML = h('div', { class: 'panel' }, [h('h2', null, 'Not found'),
        h('p', null, ['No row named ', h('code', null, esc(ctx.route.key || '')), ' in ', esc(cfg.file), '. ',
          h('a', { href: cfg.list, 'data-action': 'nav', 'data-href': cfg.list }, 'Back to the list')])]);
      return;
    }
    ctx.ui.movesRow = { file: cfg.file, row: r };
    const statusCol = S.STATUS_COL[cfg.file];
    const name = csv.get(t, r, 'Name');
    const vocab = ctx.vocab || {};
    const targetChoices = (vocab.targetChoices && vocab.targetChoices.length) ? vocab.targetChoices : S.CHOICES.target;
    const typeChoices = (vocab.moveTypeChoices && vocab.moveTypeChoices.length) ? vocab.moveTypeChoices : S.CHOICES.type;
    const elementChoices = (vocab.elementChoices && vocab.elementChoices.length) ? vocab.elementChoices : S.CHOICES.element;
    const tgt = S.mapTarget(csv.get(t, r, 'Target'));
    const users = usedBy(ctx, name);
    const issues = V.forRow(ctx.issues, cfg.file, r);
    const dupes = [];
    for (let i = 0; i < t.rows.length; i++) if (i !== r && S.canon(csv.get(t, i, 'Name')).toLowerCase() === S.canon(name).toLowerCase()) dupes.push(i);

    const field = (label, control, hint) => h('label', { class: 'field' }, [h('span', { class: 'lab' }, esc(label)), control, hint ? h('span', { class: 'hint' }, hint) : '']);

    const main = h('section', { class: 'panel' }, [
      h('h3', null, ['Row ', h('span', { class: 'hint' }, esc(cfg.file + ' line ' + (r + 2)))]),
      h('div', { class: 'row' }, [
        field('Name', h('span', { class: 'row tight' }, [
          h('input', { type: 'text', value: name, size: '26', readonly: true, 'data-focus-id': 'move-name' }),
          h('button', { type: 'button', class: 'small', 'data-action': 'moves.rename' }, 'Rename…'),
        ])),
        field('Cost', D.numInput({ value: csv.get(t, r, 'Cost'), 'data-focus-id': 'move-cost', 'data-action': 'moves.cell', 'data-col': 'Cost', 'data-on': 'change', 'aria-label': 'Cost' }), '0-8 cards'),
        field('Damage multiplier', h('input', { type: 'text', inputmode: 'decimal', class: 'stat', value: csv.get(t, r, 'Damage Multiplier'), 'data-focus-id': 'move-mult', 'data-action': 'moves.cell', 'data-col': 'Damage Multiplier', 'data-on': 'change', 'aria-label': 'Damage multiplier' }), 'x1.5 or 1.5'),
        field('Priority', D.numInput({ value: csv.get(t, r, 'Priority'), 'data-focus-id': 'move-prio', 'data-action': 'moves.cell', 'data-col': 'Priority', 'data-on': 'change', 'aria-label': 'Priority' }), 'higher acts first'),
      ]),
      h('div', { class: 'row' }, [
        field('Target', D.selectWith(targetChoices, csv.get(t, r, 'Target'), { 'data-action': 'moves.cell', 'data-col': 'Target', 'data-on': 'change', 'data-focus-id': 'move-target' }),
          esc('imports as ' + tgt.shape + ' / ' + tgt.side + (tgt.recognized ? '' : tgt.blank ? ' (blank defaults to Single Enemy)' : ' - NOT recognized'))),
        field('Type', D.selectWith(typeChoices, csv.get(t, r, 'Type'), { 'data-action': 'moves.cell', 'data-col': 'Type', 'data-on': 'change', 'data-focus-id': 'move-type' }),
          esc('imports as ' + S.mapMoveType(csv.get(t, r, 'Type')).type)),
        field('Element', D.selectWith(elementChoices, csv.get(t, r, 'Element'), { 'data-action': 'moves.cell', 'data-col': 'Element', 'data-on': 'change', 'data-focus-id': 'move-element' }),
          esc('imports as ' + S.mapElement(csv.get(t, r, 'Element')).element)),
      ]),
      h('div', { class: 'grid two' }, [
        h('div', null, [
          field(statusCol, h('input', { type: 'text', class: 'wide', value: csv.get(t, r, statusCol), 'data-focus-id': 'move-status', 'data-action': 'moves.cell', 'data-col': statusCol, 'data-on': 'change', 'aria-label': statusCol })),
          h('div', { class: 'tokenbadges' }, statusChips(ctx, csv.get(t, r, statusCol))),
        ]),
        h('div', null, [
          field('Additional', h('textarea', { class: 'wide', 'data-focus-id': 'move-additional', 'data-action': 'moves.cell', 'data-col': 'Additional', 'data-on': 'change', 'aria-label': 'Additional' }, esc(csv.get(t, r, 'Additional')))),
          tokenBadges(ctx, csv.get(t, r, 'Additional'), csv.get(t, r, statusCol), csv.get(t, r, 'Type'), name),
        ]),
      ]),
      cfg.hasDescription
        ? field('Description', h('textarea', { class: 'wide', 'data-focus-id': 'move-desc', 'data-action': 'moves.cell', 'data-col': 'Description', 'data-on': 'change', 'aria-label': 'Description' }, esc(csv.get(t, r, 'Description'))))
        : h('div', null, [
          h('p', null, D.sev('info', 'No description') + ' ' + esc('Techniques.csv has no Description column - the technique card shows the text built from its Additional/Effects cells instead. Do not add one; the importer would ignore it.')),
          field('User (documentation only)', h('input', { type: 'text', class: 'wide', value: csv.get(t, r, 'User'), 'data-focus-id': 'move-user', 'data-action': 'moves.cell', 'data-col': 'User', 'data-on': 'change', 'aria-label': 'User' }), 'the importer never reads this column'),
        ]),
    ]);

    const usedPanel = h('section', { class: 'panel' }, [
      h('h3', null, ['Used by ', h('span', { class: 'hint' }, esc(users.length + ' kit slot' + (users.length === 1 ? '' : 's')))]),
      users.length
        ? h('div', { class: 'row tight' }, users.map((u) => h('a', { class: 'chip kind-' + u.kind, href: '#/character/' + encodeURIComponent(u.key), 'data-action': 'nav', 'data-href': '#/character/' + encodeURIComponent(u.key) }, esc(u.label + ' · ' + u.slot))))
        : h('p', { class: 'hint' }, 'No character kit references this name. It still imports as an asset.'),
    ]);

    const issuePanel = h('section', { class: 'panel' }, [
      h('h3', null, ['Issues ', h('span', { class: 'hint' }, esc(issues.length + ' found'))]),
      dupes.length ? h('p', null, D.sev('warning', 'Duplicate name') + ' ' + esc(dupes.length + ' other row(s) in this file share the name: line ' + dupes.map((x) => x + 2).join(', ') + '. The LAST one wins on import.')) : '',
      issues.length
        ? h('ul', { class: 'issue-list' }, issues.map((i) => h('li', null, [D.sev(i.severity),
          h('span', null, [h('strong', null, esc(i.field)), ' ', esc(i.message), i.hint ? h('span', { class: 'hint' }, ' ' + esc(i.hint)) : '']),
          h('span', { class: 'spacer' }, ''), h('span', { class: 'code' }, esc(i.code))])))
        : h('p', { class: 'hint' }, 'Nothing to report.'),
    ]);

    rootEl.innerHTML = [
      h('div', { class: 'view-head' }, [
        h('h2', null, esc(S.canon(name) || '(blank name)')),
        h('span', { class: 'hint' }, esc(cfg.title)),
        h('span', { class: 'spacer' }, ''),
        h('button', { type: 'button', 'data-action': 'moves.duplicate' }, 'Duplicate'),
        h('button', { type: 'button', 'data-action': 'moves.new' }, 'New'),
        h('a', { href: cfg.list, 'data-action': 'nav', 'data-href': cfg.list }, 'Back to the list'),
      ]),
      main, usedPanel, issuePanel,
    ].join('');
  }

  function render(rootEl, ctx) {
    const cfg = cfgFor(ctx.route);
    ctx.ui.movesCfg = cfg;
    if (ctx.route.name === 'move' || ctx.route.name === 'technique') renderForm(rootEl, ctx, cfg);
    else { ctx.ui.movesRow = null; renderList(rootEl, ctx, cfg); }
  }

  // ---------------------------------------------------------------- rename

  function cascadeCount(ctx, oldName) {
    const ct = ctx.model.tables[S.CHARACTERS];
    if (!ct) return 0;
    const target = S.aliasMove(S.canon(oldName), ctx.vocab).toLowerCase();
    let n = 0;
    for (let r = 0; r < ct.rows.length; r++) {
      for (const slot of S.SLOTS) {
        const c = S.canon(csv.get(ct, r, slot));
        if (c && S.aliasMove(c, ctx.vocab).toLowerCase() === target) n++;
      }
    }
    return n;
  }

  function openRename(ctx, cfg, r) {
    const t = ctx.model.tables[cfg.file];
    const old = csv.get(t, r, 'Name');
    const n = cascadeCount(ctx, old);
    const aliasWarn = S.isAliasSource(old, ctx.vocab)
      ? h('p', null, D.sev('warning', 'Alias source') + ' ' + esc('"' + S.canon(old) + '" is in the importer alias map, so kit cells spelled that way point here on purpose. Renaming does not change the alias map.'))
      : '';
    D.openDialog(ctx.host, [
      h('div', { class: 'dlg-head' }, h('h3', null, 'Rename ' + esc(S.canon(old)))),
      h('div', { class: 'dlg-body' }, [
        h('p', null, [n === 0 ? 'No character kit slot references this name.' : esc(n + ' character kit slot' + (n === 1 ? '' : 's') + ' reference this name and will be rewritten in the same undo step.')]),
        aliasWarn,
        h('label', { class: 'field' }, [h('span', { class: 'lab' }, 'New name'),
          h('input', { type: 'text', id: 'rename-input', class: 'wide', value: S.canon(old), autofocus: true, 'data-action': 'moves.renameKey', 'data-on': 'keydown' })]),
        h('p', { class: 'hint' }, 'The change package carries the OLD name as the row key, so the merge on Justin’s side still finds this row.'),
      ]),
      h('div', { class: 'dlg-foot' }, [
        h('button', { type: 'button', class: 'primary', 'data-action': 'moves.renameConfirm' }, 'Rename and cascade'),
        h('span', { class: 'spacer' }, ''),
        h('button', { type: 'button', 'data-action': 'moves.renameCancel' }, 'Cancel'),
      ]),
    ].join(''));
  }

  function doRename(ctx, cfg, r) {
    const dlg = D.currentDialog(ctx.host);
    const input = dlg && dlg.querySelector('#rename-input');
    const next = input ? input.value.trim() : '';
    if (!next) { D.toast('A blank name would make the row skip on import.', 'err'); return; }
    const res = ctx.model.renameMove(cfg.file, r, next);
    D.closeDialog(ctx.host);
    D.toast('Renamed to "' + res.name + '"; ' + res.updated.length + ' kit slot(s) updated.', 'ok');
    ctx.app.navigate(cfg.item + encodeURIComponent(S.nameKey(res.name) + '@' + (r + 2)));
  }

  // ---------------------------------------------------------------- action

  function action(name, el, ev, ctx) {
    const cfg = ctx.ui.movesCfg || CFG['moves.csv'];
    const s = st(ctx, cfg.file);
    const cur = ctx.ui.movesRow;
    switch (name) {
      case 'moves.q': s.q = el.value; ctx.app.rerender(); return true;
      case 'moves.type': s.type = el.value; ctx.app.rerender(); return true;
      case 'moves.element': s.element = el.value; ctx.app.rerender(); return true;
      case 'moves.fPlaceholder': s.placeholder = !!el.checked; ctx.app.rerender(); return true;
      case 'moves.fUnused': s.unused = !!el.checked; ctx.app.rerender(); return true;
      case 'moves.fIssues': s.issues = !!el.checked; ctx.app.rerender(); return true;
      case 'moves.reset': ctx.ui.moves[cfg.file] = null; ctx.app.rerender(); return true;
      case 'moves.sort': {
        const key = el.getAttribute('data-key');
        if (s.sort === key) s.dir = -s.dir; else { s.sort = key; s.dir = 1; }
        ctx.app.rerender();
        return true;
      }
      case 'moves.cell': {
        if (!cur) return true;
        ctx.model.setCell(cur.file, cur.row, el.getAttribute('data-col'), el.value);
        ctx.app.rerender();
        return true;
      }
      case 'moves.new': {
        const t = ctx.model.tables[cfg.file];
        let base = 'New ' + (cfg.hasDescription ? 'move' : 'technique'), n = 1, candidate = base;
        const taken = new Set();
        for (let i = 0; i < t.rows.length; i++) taken.add(S.canon(csv.get(t, i, 'Name')).toLowerCase());
        while (taken.has(candidate.toLowerCase())) { n++; candidate = base + ' ' + n; }
        const row = ctx.model.addRow(cfg.file, { Name: candidate, Cost: '1', Target: 'Single Target', 'Damage Multiplier': 'x1', Type: 'Physical' });
        ctx.app.navigate(cfg.item + encodeURIComponent(S.nameKey(candidate) + '@' + (row + 2)));
        D.toast('Added ' + candidate + ' at the end of ' + cfg.file + '.', 'ok');
        return true;
      }
      case 'moves.duplicate': {
        if (!cur) return true;
        const t = ctx.model.tables[cur.file];
        const cells = {};
        for (let i = 0; i < t.headers.length; i++) {
          const head = String(t.headers[i]).trim();
          if (!head) continue;
          cells[head] = csv.get(t, cur.row, head);
        }
        const taken = new Set();
        for (let i = 0; i < t.rows.length; i++) taken.add(S.canon(csv.get(t, i, 'Name')).toLowerCase());
        let candidate = S.canon(cells.Name || 'Copy') + ' 2', n = 2;
        while (taken.has(candidate.toLowerCase())) { n++; candidate = S.canon(cells.Name || 'Copy') + ' ' + n; }
        cells.Name = candidate;
        const row = ctx.model.addRow(cur.file, cells);
        ctx.app.navigate(cfg.item + encodeURIComponent(S.nameKey(candidate) + '@' + (row + 2)));
        D.toast('Duplicated as ' + candidate + '.', 'ok');
        return true;

    t.eq(csv.write(csv.parse('a,b\r\n x ,y\r\n')).indexOf('"'), -1, 'edge whitespace never quoted');
    // BOM + CRLF + trailing newline
    const bomText = '\uFEFFName,Effect\r\nA,"x, y"\r\nB,z\r\n';

    t.eq(tb2.hadBom, true, 'BOM detected');

    t.eq(tb2.trailingNewline, true, 'trailing newline detected');

    // addRow / clone / freeze
    const r = csv.addRow(tb2);
    t.eq(tb2.rows[r], ['', ''], 'addRow header-width blanks');
    const c = csv.clone(tb2); c.rows[0][0] = 'changed';
    t.eq(tb2.rows[0][0], 'A', 'clone is deep');
    const fz = csv.freeze(tb2);
    t.throws(() => { 'use strict'; fz.rows[0][0] = 'x'; }, 'frozen cells');
    t.eq(csv.parse('').rows.length, 0, 'empty text → no rows');
    t.eq(csv.parse('a,b').rows.length, 0, 'header only');
    t.eq(csv.parse('a,b\n1,2').trailingNewline, false, 'no trailing newline');
    t.eq(csv.write(csv.parse('a,b\n1,2')), 'a,b\n1,2', 'no trailing newline preserved');
    // superfluous-quote diagnostic
    t.eq(csv.superfluousQuotes('a,b\n1,"plain"\n'), [{ row: 1, col: 1 }], 'superfluous quotes located');
    t.eq(csv.superfluousQuotes('a,b\n1,"has,comma"\n'), [], 'needed quotes are not superfluous (round-trips)');
    t.eq(csv.superfluousQuotes('\uFEFFa,b\r\n"x",2\r\n'), [{ row: 1, col: 0 }], 'superfluous quotes with BOM + CRLF');
  }

  // Anti-drift: the bundle's C#-computed probe rows must reproduce through the JS ports.
  function suiteProbes(t, vocab) {
    let ran = 0;
    if (Array.isArray(vocab.targetProbe)) for (const p of vocab.targetProbe) {
      const r = S.mapTarget(p.raw); ran++;
      t.ok(r.shape === p.shape && r.side === p.side && r.recognized === p.recognized, 'targetProbe ' + JSON.stringify(p.raw) + ' → ' + r.shape + '/' + r.side + '/' + r.recognized + ' expected ' + p.shape + '/' + p.side + '/' + p.recognized);
    }
    if (Array.isArray(vocab.typeProbe)) for (const p of vocab.typeProbe) {
      const r = S.mapMoveType(p.raw); ran++;
      t.ok(r.type === p.value && r.recognized === p.recognized, 'typeProbe ' + JSON.stringify(p.raw) + ' → ' + r.type + '/' + r.recognized + ' expected ' + p.value + '/' + p.recognized);
    }
    if (Array.isArray(vocab.elementProbe)) for (const p of vocab.elementProbe) {
      const r = S.mapElement(p.raw); ran++;
      t.ok(r.element === p.value && r.recognized === p.recognized, 'elementProbe ' + JSON.stringify(p.raw) + ' → ' + r.element + '/' + r.recognized + ' expected ' + p.value + '/' + p.recognized);
    }
    if (Array.isArray(vocab.statusProbe)) for (const p of vocab.statusProbe) {
      const toks = S.splitStatusTokens(p.raw, vocab); ran++;
      t.eq(toks, p.tokens, 'statusProbe tokens ' + JSON.stringify(p.raw));
      const res = S.resolveStatuses(p.raw, vocab);
      const flat = []; for (const r of res) for (const c of r.canonical) flat.push(c);
      const ok = JSON.stringify(res.names) === JSON.stringify(p.resolved) || JSON.stringify(flat) === JSON.stringify(p.resolved);
      t.ok(ok, 'statusProbe resolved ' + JSON.stringify(p.raw) + ' → ' + JSON.stringify(res.names) + ' expected ' + JSON.stringify(p.resolved));
    }
    t.probeCount = ran;
    if (ran === 0) t.skipped = 'no probe tables in vocab (fixture) — skipped';
  }

    const blankRow = issues.filter((i) => i.file === S.MOVES && i.row === 86);

  function suiteModel(t, vocab, loadText) {
    const texts = loadText ? liveTexts(loadText) : MINI;
    const model = M.createModel(bundleFrom(texts));
    const ct = model.tables[S.CHARACTERS];
    const fang = 0;
    t.eq(model.get(S.CHARACTERS, fang, 'Strength'), '140', 'initial cell');
    // collapse + revert
    model.setCell(S.CHARACTERS, fang, 'Strength', '145');
    model.setCell(S.CHARACTERS, fang, 'Strength', '150');
    t.eq(model.edits.size, 1, 'repeated edits collapse to one entry');
    const e = model.editsFor(S.CHARACTERS)[0];
    t.eq([e.key, e.col, e.before, e.after, e.line], ['Fang|COM', 'Strength', '140', '150', '2'], 'edit record');
    model.setCell(S.CHARACTERS, fang, 'Strength', '140');
    t.eq(model.edits.size, 0, 'revert to original deletes the entry');
    t.eq(model.hasChanges(), false, 'no changes');
    // undo/redo
    model.setCell(S.CHARACTERS, fang, 'Strength', '145');
    t.eq(model.canUndo(), true, 'canUndo');
    model.undo();
    t.eq(model.get(S.CHARACTERS, fang, 'Strength'), '140', 'undo restores cell');
    t.eq(model.edits.size, 0, 'undo clears edit');
    model.redo();
    t.eq(model.get(S.CHARACTERS, fang, 'Strength'), '145', 'redo re-applies');
    t.eq(model.edits.size, 1, 'redo re-logs');
    // transaction = one undo step
    model.transaction('two cells', () => { model.setCell(S.CHARACTERS, fang, 'Magic', '91'); model.setCell(S.CHARACTERS, fang, 'Defense', '101'); });
    t.eq(model.edits.size, 3, 'three edits');
    model.undo();
    t.eq(model.edits.size, 1, 'transaction undone as one step');
    model.redo();
    // edge-space key: Eiko
    const eikoRow = (() => { for (let r = 0; r < ct.rows.length; r++) if (csv.get(ct, r, 'CharName') === 'Eiko ') return r; return -1; })();
    t.ok(eikoRow >= 0, 'Eiko  row present');
    model.setCell(S.CHARACTERS, eikoRow, 'Speed', '81');
    t.eq(model.editsFor(S.CHARACTERS).find((x) => x.row === eikoRow).key, 'Eiko|SYN', 'edge-space name keys as Eiko|SYN');
    // add row
    const newRow = model.addRow(S.MOVES, { Name: 'Climhazzard Test', Cost: '3', Target: 'Single Target', Type: 'Physical' });
    t.eq(model.tables[S.MOVES].rows[newRow].length, model.tables[S.MOVES].headers.length, 'added row is header-width');
    t.eq(model.added[S.MOVES].has(newRow), true, 'added set');
    model.setCell(S.MOVES, newRow, 'Cost', '4');
    t.eq(model.editsFor(S.MOVES).length, 0, 'edits to added rows are not logged');
    t.eq(model.canRemoveAddedRow(S.MOVES, newRow), true, 'can remove last added row');
    // rename cascade (alias-aware). Live data: "Improved Raise" is referenced both directly
    // and through the alias "Improve Raise"; MINI: "Base Attack" via the alias "Attack".
    const target = loadText ? 'Improved Raise' : 'Base Attack';
    const baseRow = (() => { const mt = model.tables[S.MOVES]; for (let r = 0; r < mt.rows.length; r++) if (S.canon(csv.get(mt, r, 'Name')) === target) return r; return -1; })();
    t.ok(baseRow >= 0, target + ' row present in moves.csv');
    let expected = 0, viaAlias = 0;
    for (let r = 0; r < ct.rows.length; r++) for (const slot of S.SLOTS) { const c = S.canon(csv.get(ct, r, slot)); if (c && S.aliasMove(c, vocab).toLowerCase() === target.toLowerCase()) { expected++; if (c.toLowerCase() !== target.toLowerCase()) viaAlias++; } }
    t.ok(expected > 0 && viaAlias > 0, 'fixture has both direct and alias references (' + expected + '/' + viaAlias + ')');
    const before = model.edits.size;
    const ren = model.renameMove(S.MOVES, baseRow, 'Basic Strike');
    t.eq(ren.updated.length, expected, 'rename cascade touches exactly the referencing slots (alias-aware)');
    t.ok(ren.updated.every((u) => model.get(S.CHARACTERS, u.rowIdx, u.slot) === 'Basic Strike'), 'cascade wrote the new name');
    t.ok(model.editsFor(S.CHARACTERS).filter((x) => x.cause === 'rename:' + target).length === expected, 'cascade edits carry cause rename:<old>');
    t.eq(model.edits.size, before + 1 + expected, 'rename edit count');
    model.undo();
    t.eq(model.edits.size, before, 'rename undone as one step');
    t.eq(S.canon(model.get(S.MOVES, baseRow, 'Name')), target, 'name restored');
    t.eq(model.renameMove(S.MOVES, baseRow, '   ').updated.length, 0, 'blank rename is a no-op');
    // passive rename cascades only to Triangle/Square/Circle/X/Max
    const pt = model.tables[S.PASSIVES];
    const blindRow = (() => { for (let r = 0; r < pt.rows.length; r++) if (S.canon(csv.get(pt, r, 'Name')) === 'Blindside') return r; return -1; })();
    const ren2 = model.renameMove(S.PASSIVES, blindRow, 'Blindsided');
    t.ok(ren2.updated.length > 0 && ren2.updated.every((u) => S.PASSIVE_CASCADE_SLOTS.indexOf(u.slot) >= 0), 'passive cascade limited to equip+Max slots');
    model.undo();
    // package build
    model.setCell(S.CHARACTERS, fang, 'Strength', '145');
    const pkg = model.buildPackage({ author: 'Tester', comment: 'c', exportedAt: '2026-09-07T10:00:00Z' });
    t.eq(pkg.format, 'ffxdesign/1', 'format');
    t.eq([pkg.bundleId, pkg.dataHash, pkg.builtAt], ['testbundle', 'testhash', '2026-01-01T00:00:00Z'], 'meta copied');
    t.eq(Object.keys(pkg.files), [S.CHARACTERS, S.MOVES], 'files in FILES order, unchanged files omitted');
    const fe = pkg.files[S.CHARACTERS].edits;
    t.eq(fe.map((x) => x.col), ['Strength', 'Magic', 'Defense', 'Speed'], 'edits sorted by row then column index');
    t.ok(fe.every((x) => ['key', 'col', 'before', 'after', 'line'].every((k) => typeof x[k] === 'string')), 'all edit values are strings');
    t.eq(pkg.files[S.MOVES].added[0].key, 'Climhazzard Test', 'added key computed');
    t.eq(pkg.files[S.MOVES].added[0].cells, { Name: 'Climhazzard Test', Cost: '4', Target: 'Single Target', Type: 'Physical' }, 'added cells omit blanks');
    const json1 = M.packageJson(pkg), json2 = M.packageJson(JSON.parse(json1));
    t.eq(json1, json2, 'deterministic JSON');
    t.ok(json1.indexOf('{\n  "format": "ffxdesign/1",\n  "bundleId"') === 0, '2-space pretty JSON');
    t.ok(json1.indexOf('"format"') < json1.indexOf('"bundleId"') && json1.indexOf('"exportedAt"') < json1.indexOf('"files"'), 'stable key order');
    M.checkPackage(JSON.parse(json1));
    t.throws(() => M.checkPackage({ format: 'ffxdesign/1', files: { 'moves.csv': { edits: [{ key: 'x', col: 'Cost', before: '1', after: 2 }] } } }), 'non-string rejected');
    t.throws(() => M.checkPackage({ format: 'other/1', files: {} }), 'wrong format rejected');
    // apply onto pristine == edited tables, serializes identically
    const fresh = M.createModel(bundleFrom(texts));
    const res = M.applyPackage(fresh.tables, JSON.parse(json1));
    t.eq([res.applied, res.already, res.conflicts.length, res.added, res.headersAdded], [4, 0, 0, 1, 0], 'apply counts');
    for (const f of S.EDITABLE) t.eq(csv.write(fresh.tables[f]), csv.write(model.tables[f]), 'apply onto pristine reproduces edited ' + f);
    const res2 = M.applyPackage(fresh.tables, JSON.parse(json1));
    t.eq([res2.applied, res2.already, res2.conflicts.length, res2.added], [0, 5, 0, 0], 'apply twice → all already-applied (added row counts as already)');
    // mutated base → conflict with current
    const mut = M.createModel(bundleFrom(texts));
    csv.set(mut.tables[S.CHARACTERS], fang, 'Strength', '150');
    const res3 = M.applyPackage(mut.tables, JSON.parse(json1));
    t.eq(res3.conflicts.length, 1, 'mutated base → one conflict');
    t.eq(res3.conflicts[0], { file: S.CHARACTERS, key: 'Fang|COM', col: 'Strength', current: '150', before: '140', after: '145', kind: 'changed' }, 'conflict carries current/before/after');
    t.eq(res3.applied, 3, 'other edits still applied');
    // added-row collision
    const col = M.createModel(bundleFrom(texts));
    const ridx = csv.addRow(col.tables[S.MOVES]);
    csv.set(col.tables[S.MOVES], ridx, 'Name', 'Climhazzard Test');
    csv.set(col.tables[S.MOVES], ridx, 'Cost', '9');
    const res4 = M.applyPackage(col.tables, JSON.parse(json1));
    t.ok(res4.conflicts.some((c) => c.kind === 'row-exists' && c.key === 'Climhazzard Test'), 'added-row collision → conflict');
    // key-changing edit resolved via recomputed key (rename Fang → Fangs)
    const rn = M.createModel(bundleFrom(texts));
    rn.setCell(S.CHARACTERS, fang, 'CharName', 'Fangs');
    rn.setCell(S.CHARACTERS, fang, 'Magic', '95');
    const pkgRn = rn.buildPackage({ exportedAt: 'x' });
    t.eq(pkgRn.files[S.CHARACTERS].edits.map((x) => x.key), ['Fang|COM', 'Fang|COM'], 'renamed row keeps its original key');
    const rnFresh = M.createModel(bundleFrom(texts));
    const r1 = M.applyPackage(rnFresh.tables, pkgRn);
    t.eq([r1.applied, r1.conflicts.length], [2, 0], 'rename applies');
    const r2 = M.applyPackage(rnFresh.tables, pkgRn);
    t.eq([r2.applied, r2.already, r2.conflicts.length], [0, 2, 0], 'second apply: old key missing → recomputed key → already-applied');
    const r3 = M.applyPackage(M.createModel(bundleFrom(texts)).tables, { format: 'ffxdesign/1', files: { 'Characters.csv': { edits: [{ key: 'Nobody|COM', col: 'Strength', before: '1', after: '2' }], added: [] } } });
    t.eq(r3.conflicts[0].kind, 'missing-row', 'missing row conflict');
    // ambiguous key
    const amb = M.createModel(bundleFrom(texts));
    const dupRow = (() => { const mt = amb.tables[S.MOVES]; for (let r = 0; r < mt.rows.length; r++) if (S.canon(csv.get(mt, r, 'Name')) === 'Slow') return r; return -1; })();
    const r4 = M.applyPackage(amb.tables, { format: 'ffxdesign/1', files: { 'moves.csv': { edits: [{ key: 'Slow', col: 'Cost', before: csv.get(amb.tables[S.MOVES], dupRow, 'Cost'), after: '7' }], added: [] } } });
    t.eq(r4.conflicts.length && r4.conflicts[0].kind, 'ambiguous-key', 'duplicate key → ambiguous-key conflict');
    // missing column appended once (rows stay ragged), case-insensitive file name
    const hc = M.createModel(bundleFrom(texts));
    const r5 = M.applyPackage(hc.tables, { format: 'ffxdesign/1', files: { 'characters.csv': { edits: [
      { key: 'Fang|COM', col: 'ZZ Test Col', before: '', after: 'hello' }, { key: 'Hope|SEN', col: 'ZZ Test Col', before: '', after: 'hi' }], added: [] } } });
    t.eq([r5.headersAdded, r5.applied, r5.conflicts.length], [1, 2, 0], 'missing column appended once; file resolved case-insensitively');
    t.eq(hc.tables[S.CHARACTERS].headers[hc.tables[S.CHARACTERS].headers.length - 1], 'ZZ Test Col', 'header appended at the end');
    t.eq(hc.tables[S.CHARACTERS].rows[2].length < hc.tables[S.CHARACTERS].headers.length, true, 'other rows stay ragged');
    const r6 = M.applyPackage(M.createModel(bundleFrom(texts)).tables, { format: 'ffxdesign/1', files: { 'Characters.csv': { edits: [{ key: 'Fang|COM', col: 'ZZ Test Col', before: 'old', after: 'new' }], added: [] } } });
    t.eq(r6.conflicts[0].kind, 'missing-column', 'missing column with non-blank before → conflict');
    const r7 = M.applyPackage(M.createModel(bundleFrom(texts)).tables, { format: 'ffxdesign/1', files: { 'nope.csv': { edits: [], added: [] } } });
    t.eq(r7.conflicts[0].kind, 'unknown-file', 'unknown file conflict');
    // model.applyPackage logs edits + is one undo step
    const viaModel = M.createModel(bundleFrom(texts));
    const r8 = viaModel.applyPackage(JSON.parse(json1));
    t.eq(r8.applied, 4, 'model.applyPackage applied');
    t.eq(viaModel.edits.size, 4, 'model.applyPackage logs edits');
    t.eq(viaModel.added[S.MOVES].size, 1, 'model.applyPackage records added rows');
    t.eq(M.packageJson(viaModel.buildPackage({ author: 'Tester', comment: 'c', exportedAt: '2026-09-07T10:00:00Z' })), json1, 'round trip through model reproduces the package');
    viaModel.undo();
    t.eq(viaModel.changeCount(), 0, 'applyPackage undone as one step');
    // discardAll + removeAddedRow
    model.discardAll();
    t.eq(model.changeCount(), 0, 'discardAll clears everything');
    t.eq(model.tables[S.MOVES].rows.length, model.pristine[S.MOVES].rows.length, 'discardAll removed the added row');
    t.eq(model.removeAddedRow(S.MOVES, 0), false, 'cannot remove a pristine row');
    // exportFilename
    t.eq(M.exportFilename(' Jo  Designer. ', new Date(2026, 8, 7, 15, 4)), 'FFX changes 2026-09-07 1504 Jo Designer.ffxdesign.json', 'export filename');
    t.eq(M.exportFilename('a/b:c', new Date(2026, 8, 7, 15, 4)), 'FFX changes 2026-09-07 1504 a_b_c.ffxdesign.json', 'export filename strips illegal chars');
    t.eq(M.exportFilename('', new Date(2026, 0, 1, 0, 0)), 'FFX changes 2026-01-01 0000.ffxdesign.json', 'export filename no author');
    // model on the real bundle shape: csv[file].text with BOM flag
    const bm = M.createModel({ meta: { dataHash: 'h' }, csv: { 'passives.csv': { text: texts[S.PASSIVES], hadBom: true, newLine: '\n', trailingNewline: true } } });
    t.eq(bm.tables[S.PASSIVES].hadBom, true, 'BOM flag honored');
  }

  function suiteBulk(t, vocab, loadText) {
    const texts = loadText ? liveTexts(loadText) : MINI;
    const model = M.createModel(bundleFrom(texts));
    const ct = model.tables[S.CHARACTERS];
    const rowOf = (name, cls) => { for (let r = 0; r < ct.rows.length; r++) if (S.canon(csv.get(ct, r, 'CharName')) === name && csv.get(ct, r, 'Class') === cls) return r; return -1; };
    const fang = rowOf('Fang', 'COM'), fangSen = rowOf('Fang', 'SEN'), hope = rowOf('Hope', 'SEN');
    // 98 + 5 crosses tier
    const t98 = M.createModel(bundleFrom({ 'Characters.csv': 'CharName,Class,Strength,Speed\nA,COM,98,50\nB,COM,110,60\nC,COM,120,70\nD,SEN,,40\n' }));
    let pv = B.preview(t98, [], vocab, { rows: [0], stats: ['Strength'], op: { kind: 'add', value: 5 } });
    t.eq([pv.rows[0].before, pv.rows[0].after, pv.rows[0].annot.tierBefore, pv.rows[0].annot.tierAfter], [98, 103, 1, 2], '98+5 crosses into tier 2');
    t.eq(pv.summary.tierUp, 1, 'tier crossing counted');
    t.eq([pv.rows[0].annot.baseBefore, pv.rows[0].annot.baseAfter], [980, 1090], 'base damage annotation');
    // ×10% on 140 → 154
    pv = B.preview(model, [], vocab, { rows: [fang], stats: ['Strength'], op: { kind: 'multiply', percent: 10 } });
    t.eq(pv.rows[0].after, 154, 'x10% on 140 → 154');
    // toward median 100% → median
    pv = B.preview(t98, [], vocab, { rows: [0], stats: ['Strength'], op: { kind: 'towardMedian', percent: 100 } });
    t.eq(pv.rows[0].median, 110, 'class median over effective values');
    t.eq(pv.rows[0].after, 110, 'toward median 100% lands on the median');
    pv = B.preview(t98, [], vocab, { rows: [0], stats: ['Strength'], op: { kind: 'towardMedian', percent: 50 } });
    t.eq(pv.rows[0].after, 104, 'toward median 50%');
    // step-5 rounding
    pv = B.preview(t98, [], vocab, { rows: [0], stats: ['Strength'], op: { kind: 'add', value: 4 }, step: 5 });
    t.eq(pv.rows[0].after, 100, 'step 5 rounding (102 → 100)');
    // > 300 flag and clamp option
    pv = B.preview(t98, [], vocab, { rows: [2], stats: ['Strength'], op: { kind: 'set', value: 350 } });
    t.eq([pv.rows[0].over300, pv.summary.over300], [true, 1], '>300 flagged');
    pv = B.preview(t98, [], vocab, { rows: [2], stats: ['Strength'], op: { kind: 'set', value: 350 }, clamp300: true });
    t.eq([pv.rows[0].after, pv.rows[0].over300], [300, false], 'clamp to 300');
    // skip-blank vs materialize
    pv = B.preview(t98, [], vocab, { rows: [3], stats: ['Strength'], op: { kind: 'add', value: 5 } });
    t.eq([pv.rows[0].skipped, pv.summary.skipped], [true, 1], 'blank skipped by default');
    pv = B.preview(t98, [], vocab, { rows: [3], stats: ['Strength'], op: { kind: 'add', value: 5 }, skipBlank: false });
    t.eq([pv.rows[0].skipped, pv.rows[0].before, pv.rows[0].after, pv.rows[0].materialized, pv.summary.materialized], [false, 80, 85, true, 1], 'materialize effective (fallback 80) + 5');
    pv = B.preview(t98, [], vocab, { rows: [3], stats: ['Strength'], op: { kind: 'add', value: 0 }, skipBlank: false });
    t.eq([pv.rows[0].changed, pv.rows[0].after], [true, 80], 'materializing with no delta still writes the cell');
    // floor 0, clamp op
    pv = B.preview(t98, [], vocab, { rows: [0], stats: ['Strength'], op: { kind: 'add', value: -500 } });
    t.eq(pv.rows[0].after, 0, 'floor at 0');
    pv = B.preview(t98, [], vocab, { rows: [0, 1, 2], stats: ['Strength'], op: { kind: 'clamp', min: 100, max: 115 } });
    t.eq(pv.rows.map((r) => r.after), [100, 110, 115], 'clamp op');
