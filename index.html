    D.toast('Stopped saving to a file. Changes still autosave in this browser.', 'ok');
    rerender();
  }

  // Boot: reattach last session's file if the browser still grants writing.
  // Permission usually needs a gesture, so 'prompt' becomes a resume banner
  // rather than a silent failure the designer would never notice.
  function restoreSaveFile() {
    if (!FS.supported()) return;
    FS.recall().then((handle) => {
      if (!handle) return;
      state.fileHandle = handle;
      state.fileName = handle.name || 'the chosen file';
      return FS.permission(handle).then((p) => {
        state.fileNeedsResume = (p !== 'granted');
        renderBanners();
      });
    }).catch(() => { /* best effort */ });
  }

  // ------------------------------------------------------------------ export

  function exportPackage() {
    if (!state.model.hasChanges()) { D.toast('Nothing to export yet - make a change first.', 'warn'); return; }
    const pkg = state.model.buildPackage({ author: state.author, comment: state.comment, studioVersion: String(meta().studioVersion || '') });
    const filename = M.exportFilename(state.author);
    D.download(filename, M.packageJson(pkg), 'application/json;charset=utf-8');
    D.toast('Saved ' + filename + ' - send that file to Justin.', 'ok', 8000);
  }

  // ------------------------------------------------------------------ events

  function onAction(action, el, ev) {
    const ctx = state.ctx || makeCtx();
    if (action.indexOf('picker.') === 0) return P.handle(action, el, ev, ctx);
    switch (action) {
      case 'nav': navigate(el.getAttribute('data-href')); return true;
      case 'app.undo': { const l = state.model.undo(); if (l) D.toast('Undid: ' + l); rerender(); return true; }
      case 'app.redo': { const l = state.model.redo(); if (l) D.toast('Redid: ' + l); rerender(); return true; }
      case 'app.export': exportPackage(); return true;
      case 'app.pickFile': pickSaveFile(); return true;
      case 'app.resumeFile': resumeSaveFile(); return true;
      case 'app.stopFile': stopSaveFile(); return true;
      case 'app.author': setAuthor(el.value.trim()); rerender(); return true;
      case 'app.skipName': state.nameAsked = true; rerender(); return true;
      case 'app.dismissDraft': state.draftStatus = ''; rerender(); return true;
      case 'app.discardRestored': state.model.discardAll(); state.draftStatus = ''; saveDraftNow(); D.toast('Restored changes discarded.', 'ok'); rerender(); return true;
      case 'app.reapplyDraft': {
        const d = state.pendingDraft;
        state.pendingDraft = null;
        if (d) {
          const res = state.model.reapplyDraft(state.storage, d.dataHash);
          if (res) {
            const c = res.result;
            D.toast(c.applied + ' re-applied, ' + c.already + ' already there, ' + c.conflicts.length + ' could not be applied.', c.conflicts.length ? 'warn' : 'ok', 9000);
          }
        }
        rerender();
        return true;
      }
      case 'app.dropOldDraft': { if (state.pendingDraft) state.model.deleteDraft(state.storage, state.pendingDraft.dataHash); state.pendingDraft = null; rerender(); return true; }
      case 'app.ignoreOldDraft': state.pendingDraft = null; rerender(); return true;
      default: break;
    }
    const view = VIEWS[state.route.view];
    if (view && view.action && view.action(action, el, ev, ctx)) return true;
    return false;
  }

  function onKey(ev) {
    const tag = ev.target && ev.target.tagName;
    const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    if (ev.key === 'Escape') {
      if (D.currentDialog(state.appEl)) { D.closeDialog(state.appEl); ev.preventDefault(); }
      return;
    }
    if (ev.key === '/' && !typing && !ev.ctrlKey && !ev.metaKey) {
      const box = state.viewEl && state.viewEl.querySelector('input[type=search]');
      if (box) { ev.preventDefault(); try { box.focus(); box.select(); } catch (e) { /* ignore */ } }
      return;
    }
    if (!(ev.ctrlKey || ev.metaKey)) return;
    const k = String(ev.key).toLowerCase();
    if (k === 's') { ev.preventDefault(); exportPackage(); return; }
    if (k === 'z' && !ev.shiftKey) { ev.preventDefault(); const l = state.model.undo(); if (l) D.toast('Undid: ' + l); rerender(); return; }
    if (k === 'y' || (k === 'z' && ev.shiftKey)) { ev.preventDefault(); const l = state.model.redo(); if (l) D.toast('Redid: ' + l); rerender(); }
  }

  function setAuthor(name) {
    state.author = String(name || '');
    state.nameAsked = true;
    try { M.writeAuthor(state.storage, state.author); } catch (e) { /* best effort */ }
    scheduleDraftSave();
  }

  // ------------------------------------------------------------------- boot

  function pickStorage() {
    try {
      const ls = root.localStorage;
      const probe = 'ffxds:probe';
      ls.setItem(probe, '1'); ls.removeItem(probe);
      state.storageOk = true;
      return ls;
    } catch (e) {
      state.storageOk = false;
      return M.memoryStorage();
    }
  }

  function buildRosterIndex(roster) {
    const m = new Map();
    for (const e of (roster || [])) if (e && e.line != null) { const l = Number(e.line); if (!m.has(l)) m.set(l, e); }
    return m;
  }

  const SHELL = h('div', { class: 'shell' }, [
    h('nav', { class: 'nav', id: 'ffx-nav', 'aria-label': 'Sections' }, ''),
    h('div', { class: 'main' }, [h('div', { id: 'ffx-banners' }, ''), h('div', { id: 'ffx-view' }, '')]),
  ]);

  function boot(bundle) {
    const appEl = document.getElementById('app');
    if (!appEl) return;
    state.bundle = bundle;
    state.vocab = bundle.vocab || {};
    state.roster = bundle.roster || [];
    state.rosterByLine = buildRosterIndex(state.roster);
    state.storage = pickStorage();
    state.model = M.createModel(bundle);
    state.author = M.readAuthor(state.storage);
    state.nameAsked = !!state.author;

    // Draft for THIS data hash: restore silently and say so. Drafts for other
    // hashes are offered, never applied without a click.
    const restored = state.model.restoreDraft(state.storage);
    if (restored) {
      const n = M.packageCount(restored.pkg);
      const bad = restored.result.conflicts.length;
      state.draftStatus = n + ' change' + (n === 1 ? '' : 's') + ' restored from this browser'
        + (bad ? ' (' + bad + ' could not be re-applied)' : '') + '.';
      if (restored.pkg.comment) state.comment = restored.pkg.comment;
    } else {
      const others = state.model.listOtherDrafts(state.storage);
      if (others.length) state.pendingDraft = others[0];
    }

    appEl.innerHTML = SHELL;
    state.appEl = appEl;
    state.navEl = document.getElementById('ffx-nav');
    state.viewEl = document.getElementById('ffx-view');
    state.bannerEl = document.getElementById('ffx-banners');

    D.delegate(appEl, onAction);
    document.addEventListener('keydown', onKey, false);
    root.addEventListener('hashchange', onHashChange, false);
    root.addEventListener('beforeunload', () => { if (state.saveTimer) { clearTimeout(state.saveTimer); state.saveTimer = null; } saveDraftNow(); }, false);
    state.model.subscribe(() => scheduleDraftSave());

    state.route = parseRoute((typeof location !== 'undefined' && location.hash) || '#/roster');
    rerender();
    if (restored) D.toast(state.draftStatus, 'ok', 9000);
    // After the first paint: it is async and only ever adds a banner or a header
    // label, so it must not hold up the app coming up.
    restoreSaveFile();
  }

  // --------------------------------------------------------------- selftest

  function bundleLoader(bundle) {
    return function (fileKey) {
      const c = bundle.csv || {};
      let e = c[fileKey];
      if (!e) { const hit = Object.keys(c).find((k) => k.toLowerCase() === String(fileKey).toLowerCase()); if (hit) e = c[hit]; }
      if (!e) throw new Error('bundle has no CSV entry for ' + fileKey);
      return typeof e === 'string' ? e : String(e.text);
    };
  }

  // Renders every route into a detached element with a throwaway model - proves
  // the views survive the real data before a designer ever clicks anything.
  function smokeViews(bundle, log) {
    let fails = 0, n = 0;
    const model = M.createModel(bundle);
    const roster = bundle.roster || [];
    const stub = {
      rerender() {}, navigate() {}, exportPackage() {}, setAuthor() {}, saveDraft() {},
      forgetDraft() {}, author: 'Selftest', comment: '', draftStatus: '',
    };
    const ui = {};
    const host = document.createElement('div');
    const ct = model.tables[S.CHARACTERS], mt = model.tables[S.MOVES], tt = model.tables[S.TECHNIQUES], pt = model.tables[S.PASSIVES];
    const first = (t) => { for (let r = 0; r < t.rows.length; r++) { const v = S.canon(csv.get(t, r, 'Name')); if (v) return v; } return ''; };
    const routes = [
      '#/roster',
      '#/character/' + encodeURIComponent(S.rowKey(S.CHARACTERS, ct, 0)),
      '#/moves', '#/move/' + encodeURIComponent(S.nameKey(first(mt))),
      '#/techniques', '#/technique/' + encodeURIComponent(S.nameKey(first(tt))),
      '#/passives', '#/passive/' + encodeURIComponent(S.nameKey(first(pt))),
      '#/bulk', '#/changes', '#/help',
    ];
    for (const hash of routes) {
      const route = parseRoute(hash);
      const ctx = {
        model, bundle, vocab: bundle.vocab || {}, roster, rosterByLine: buildRosterIndex(roster),
        issues: V.validateAll(model.tables, bundle.vocab || {}, roster, { origKey: model.origKey, version: model.version }),
        known: S.knownSets(model.tables, bundle.vocab || {}), route, ui, host, app: stub,
      };
      const el = document.createElement('div');
      n++;
      try {
        (VIEWS[route.view] || VIEWS.roster).render(el, ctx);
        if (!el.innerHTML || el.innerHTML.length < 40) { fails++; log('FAIL render ' + hash + ' (empty output)'); }
      } catch (e) {
        fails++;
        log('FAIL render ' + hash + ': ' + (e && e.stack ? e.stack : e));
      }
    }
    if (!fails) log('PASS render (' + n + ' views)');
    return fails;
  }

  function runSelftest(bundle) {
    const lines = [];
    const log = (l) => lines.push(String(l));
    let failed = 0;
    if (!bundle) { log('FAIL no bundle embedded in this page'); failed++; }
    else {
      let res = null;
      try {
        res = SELFTEST.run({
          loadText: bundleLoader(bundle), vocab: bundle.vocab || {}, roster: bundle.roster || [],
          storage: M.memoryStorage(), bundleCsv: bundle.csv, log,
        });
      } catch (e) {
        log('FAIL selftest threw: ' + (e && e.stack ? e.stack : e));
        failed++;
      }
      if (res) failed += res.failed;
      try { failed += smokeViews(bundle, log); }
      catch (e) { failed++; log('FAIL smoke render threw: ' + (e && e.stack ? e.stack : e)); }
    }
    const pre = document.createElement('pre');
    pre.id = 'selftest';
    pre.className = 'selftest';
    pre.textContent = lines.join('\n');
    const p = document.createElement('p');
    p.id = 'selftest-result';
    p.textContent = failed ? 'SELFTEST FAIL' : 'SELFTEST PASS';
    while (document.body.firstChild) document.body.removeChild(document.body.firstChild);
    document.body.appendChild(pre);
    document.body.appendChild(p);
  }

  // -------------------------------------------------------------------- api

  const api = {
    boot, rerender, navigate, exportPackage, setAuthor, parseRoute, runSelftest,
    saveDraft: scheduleDraftSave,
    forgetDraft() { state.model.deleteDraft(state.storage); state.draftStatus = ''; D.toast('The saved draft was deleted; your changes are still on screen.', 'ok'); },
    get author() { return state.author; },
    set author(v) { setAuthor(v); },
    get comment() { return state.comment; },
    set comment(v) { state.comment = String(v || ''); scheduleDraftSave(); },
    get draftStatus() { return state.draftStatus; },
    state,
  };

  function start() {
    if (typeof document === 'undefined') return;
    const bundle = root.FFX_BUNDLE || null;
    const search = (typeof location !== 'undefined' && location.search) || '';
    if (/[?&]selftest=1(&|$)/.test(search)) { runSelftest(bundle); return; }
    if (!bundle) return;                    // template stays on its "no data" page
    const placeholder = document.getElementById('no-bundle');
    if (placeholder && placeholder.parentNode) placeholder.parentNode.removeChild(placeholder);
    boot(bundle);
  }

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, false);
    else start();
  }

  if (typeof module === 'object' && module.exports) module.exports = api;
  else (root.FFXDS = root.FFXDS || {})['app'] = api;
})(typeof globalThis !== 'undefined' ? globalThis : this);

;

</script>
</body>
</html>
